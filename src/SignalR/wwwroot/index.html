<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>PixelQueue</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #ffffff;
            --text: #222222;
            --muted: #777777;
            --border: #dddddd;
            --ok: #1a8f3c;
            --error: #c62828;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #16181d;
                --text: #e6e6e6;
                --muted: #9aa0aa;
                --border: #333844;
                --ok: #4cd07a;
                --error: #ff6b6b;
            }
        }

        body {
            font-family: system-ui, sans-serif;
            max-width: 720px;
            margin: 2rem auto;
            padding: 0 1rem;
            background: var(--bg);
            color: var(--text);
        }

        h1 {
            margin-bottom: 0.2rem;
        }

        .muted {
            color: var(--muted);
            font-size: 0.85rem;
        }

        form {
            display: grid;
            gap: 0.7rem;
            margin: 1.5rem 0;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        label {
            display: grid;
            gap: 0.2rem;
            font-size: 0.9rem;
        }

        [hidden] {
            display: none !important;
        }

        button {
            padding: 0.6rem;
            border: 0;
            border-radius: 6px;
            background: #3b6cf6;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }

        button.secondary {
            background: #666;
        }

        .task {
            padding: 0.8rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 0.7rem;
        }

        .status {
            font-weight: 600;
        }

        .status.Completed {
            color: var(--ok);
        }

        .status.Failed {
            color: var(--error);
        }

        .task img {
            max-width: 100%;
            margin-top: 0.6rem;
            border-radius: 6px;
        }

        #conn {
            font-size: 0.85rem;
        }

        .auth-block {
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .auth-block input {
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg);
            color: var(--text);
        }

        .auth-block .row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .auth-block .row button {
            flex: 1;
        }

        .auth-status {
            font-size: 0.9rem;
            color: var(--muted);
        }

        .hint {
            font-size: 0.75rem;
            color: var(--muted);
        }
    </style>
</head>
<body>
<h1>PixelQueue</h1>
<div class="muted">Загрузите картинку, выберите фильтр. Результат появится сам, когда обработка закончится.</div>
<div class="muted" id="conn">Уведомления: подключаюсь…</div>

<!-- Блок авторизации -->
<div class="auth-block" id="authBlock">
    <div id="authForm">
        <label>Логин
            <input id="login" type="text" placeholder="Введите логин (мин. 3 символа)" minlength="3" maxlength="32">
            <span class="hint">От 3 до 32 символов</span>
        </label>
        <label>Пароль
            <input id="password" type="password" placeholder="Введите пароль (мин. 8 символов)" minlength="8" maxlength="128">
            <span class="hint">От 8 до 128 символов</span>
        </label>
        <div class="row">
            <button type="button" onclick="register()">Зарегистрироваться</button>
            <button type="button" onclick="login()" class="secondary">Войти</button>
        </div>
        <div class="auth-status" id="authStatus"></div>
    </div>
    <div hidden id="authInfo">
        <span class="auth-status" id="authUser"></span>
        <button type="button" onclick="logout()" class="secondary" style="margin-top:0.5rem;">Выйти</button>
    </div>
</div>

<form id="form">
    <label>Изображение
        <input accept="image/*" id="file" required type="file">
    </label>
    <label>Фильтр
        <select id="filter">
            <option value="Negative">Негатив</option>
            <option value="Mirror">Зеркало</option>
            <option value="Blur">Размытие</option>
            <option value="Sharpen">Резкость</option>
        </select>
    </label>
    <label hidden id="blurBox">Радиус размытия
        <input id="blur" min="0" step="0.5" type="number" value="5">
    </label>
    <button type="submit">Отправить на обработку</button>
</form>

<h3>Задачи</h3>
<div id="tasks"></div>

<h3>Мои задачи</h3>
<button type="button" id="loadHistoryBtn" onclick="toggleHistory()" class="secondary" style="margin-bottom:0.7rem;">Показать историю</button>
<div id="history"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
<script>
    const apiUrl = fetch("/config").then(r => r.json()).then(c => c.apiUrl);

    // Анонимный sessionId генерируется только при отправке задачи без авторизации
    let sessionId = localStorage.getItem("authSessionId") || localStorage.getItem("anonSessionId");
    if (!sessionId) {
        sessionId = crypto.randomUUID();
        localStorage.setItem("anonSessionId", sessionId);
    }

    const taskRows = {};

    function addTaskRow(taskId, filter) {
        const row = document.createElement("div");
        row.className = "task";
        row.innerHTML = '<div></div><div class="status"></div><div class="result"></div>';
        row.children[0].textContent = "Задача " + taskId.slice(0, 8) + " · " + filter;
        document.getElementById("tasks").prepend(row);
        taskRows[taskId] = row;
        setStatus(taskId, "В очереди…", "Pending");
    }

    function setStatus(taskId, text, cls) {
        const el = taskRows[taskId]?.querySelector(".status");
        if (!el) return;
        el.textContent = text;
        el.className = "status " + (cls || "");
    }

    async function showResult(taskId) {
        const API = await apiUrl;
        const response = await fetch(API + "/tasks/" + taskId + "/result");
        if (!response.ok) {
            setStatus(taskId, "Не удалось скачать результат", "Failed");
            return;
        }
        const url = URL.createObjectURL(await response.blob());
        const box = taskRows[taskId].querySelector(".result");
        const img = document.createElement("img");
        img.src = url;
        const link = document.createElement("a");
        link.href = url;
        link.download = taskId + ".png";
        link.textContent = "Скачать";
        box.append(img, document.createElement("br"), link);
    }

    let historyVisible = false;
    async function toggleHistory() {
        const btn = document.getElementById("loadHistoryBtn");
        const container = document.getElementById("history");
        if (historyVisible) {
            container.innerHTML = "";
            container.style.display = "none";
            btn.textContent = "Показать историю";
            historyVisible = false;
        } else {
            container.style.display = "";
            await loadHistory();
            btn.textContent = "Скрыть историю";
            historyVisible = true;
        }
    }

    async function loadHistory() {
        const API = await apiUrl;
        const headers = {};
        const sid = localStorage.getItem("authSessionId");
        if (sid) {
            headers["Authorization"] = "Bearer " + sid;
        }
        const res = await fetch(API + "/tasks?page=1&pageSize=10", { headers });
        if (!res.ok) {
            document.getElementById("history").textContent = "Не удалось загрузить историю (нужна авторизация)";
            return;
        }
        const tasks = await res.json();
        const container = document.getElementById("history");
        container.innerHTML = "";
        if (!tasks || tasks.length === 0) {
            container.textContent = "История пуста";
            return;
        }
        tasks.forEach(t => {
            const row = document.createElement("div");
            row.className = "task";
            row.innerHTML = '<div></div><div class="status"></div><div class="result"></div>';
            row.children[0].textContent = "Задача " + t.id.slice(0, 8) + " · " + (t.filter || "");
            const st = row.querySelector(".status");
            st.textContent = t.status === 2 ? "Готово" : (t.status === 0 ? "В очереди…" : "Обработка…");
            st.className = "status " + (t.status === 2 ? "Completed" : "");
            if (t.status === 2) {
                const box = row.querySelector(".result");
                const img = document.createElement("img");
                img.src = API + "/tasks/" + t.id + "/result";
                const link = document.createElement("a");
                link.href = API + "/tasks/" + t.id + "/result";
                link.download = t.id + ".png";
                link.textContent = "Скачать";
                box.append(img, document.createElement("br"), link);
            }
            container.append(row);
        });
    }

    const connection = new signalR.HubConnectionBuilder()
        .withUrl("/hubs/notifications?sessionId=" + sessionId)
        .withAutomaticReconnect()
        .build();

    connection.on("TaskCompleted", (data) => {
        setStatus(data.taskId, "Готово", "Completed");
        showResult(data.taskId);
    });
    connection.on("TaskFailed", (data) => {
        setStatus(data.taskId, "Ошибка: " + data.error, "Failed");
    });
    connection.onreconnected(() => setConn("подключено"));
    connection.onclose(() => setConn("нет связи"));

    function setConn(text) {
        document.getElementById("conn").textContent = "Уведомления: " + text;
    }

    connection.start().then(() => setConn("подключено")).catch(() => setConn("нет связи"));

    const filterSelect = document.getElementById("filter");
    filterSelect.onchange = () => {
        document.getElementById("blurBox").hidden = filterSelect.value !== "Blur";
    };

    function updateAuthUI() {
        const sid = localStorage.getItem("authSessionId");
        const authForm = document.getElementById("authForm");
        const authInfo = document.getElementById("authInfo");
        const authUser = document.getElementById("authUser");
        if (sid) {
            authForm.hidden = true;
            authInfo.hidden = false;
            authUser.textContent = "Вошли (сессия: " + sid.slice(0, 8) + "…)";
        } else {
            authForm.hidden = false;
            authInfo.hidden = true;
        }
    }

    // Загрузить историю при старте, если авторизован
    if (localStorage.getItem("authSessionId")) {
        loadHistory();
    }

    async function register() {
        const login = document.getElementById("login").value;
        const password = document.getElementById("password").value;
        if (!login || !password) {
            document.getElementById("authStatus").textContent = "Введите логин и пароль";
            return;
        }
        if (login.length < 3 || login.length > 32) {
            document.getElementById("authStatus").textContent = "Логин: от 3 до 32 символов";
            return;
        }
        if (password.length < 8 || password.length > 128) {
            document.getElementById("authStatus").textContent = "Пароль: от 8 до 128 символов";
            return;
        }
        const API = await apiUrl;
        try {
            const regRes = await fetch(API + "/register", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({login, password})
            });
            if (!regRes.ok) {
                document.getElementById("authStatus").textContent = "Ошибка регистрации";
                return;
            }
            const loginRes = await fetch(API + "/login", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({login, password})
            });
            if (!loginRes.ok) {
                document.getElementById("authStatus").textContent = "Ошибка входа";
                return;
            }
            const data = await loginRes.json();
            localStorage.setItem("authSessionId", data.sessionId);
            sessionId = data.sessionId;
            updateAuthUI();
            loadHistory();
            connection.stop().then(() => {
                connection.withUrl("/hubs/notifications?sessionId=" + sessionId);
                connection.start().then(() => setConn("подключено"));
            });
        } catch (err) {
            document.getElementById("authStatus").textContent = "Ошибка сети";
        }
    }

    async function login() {
        const login = document.getElementById("login").value;
        const password = document.getElementById("password").value;
        if (!login || !password) {
            document.getElementById("authStatus").textContent = "Введите логин и пароль";
            return;
        }
        if (login.length < 3 || login.length > 32) {
            document.getElementById("authStatus").textContent = "Логин: от 3 до 32 символов";
            return;
        }
        if (password.length < 8 || password.length > 128) {
            document.getElementById("authStatus").textContent = "Пароль: от 8 до 128 символов";
            return;
        }
        const API = await apiUrl;
        try {
            const loginRes = await fetch(API + "/login", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({login, password})
            });
            if (!loginRes.ok) {
                document.getElementById("authStatus").textContent = "Неверный логин или пароль";
                return;
            }
            const data = await loginRes.json();
            localStorage.setItem("authSessionId", data.sessionId);
            sessionId = data.sessionId;
            updateAuthUI();
            loadHistory();
            connection.stop().then(() => {
                connection.withUrl("/hubs/notifications?sessionId=" + sessionId);
                connection.start().then(() => setConn("подключено"));
            });
        } catch (err) {
            document.getElementById("authStatus").textContent = "Ошибка сети";
        }
    }

    function logout() {
        localStorage.removeItem("authSessionId");
        sessionId = crypto.randomUUID();
        localStorage.setItem("anonSessionId", sessionId);
        updateAuthUI();
        document.getElementById("history").innerHTML = "";
        document.getElementById("history").style.display = "none";
        document.getElementById("loadHistoryBtn").textContent = "Показать историю";
        historyVisible = false;
        connection.stop().then(() => {
            connection.withUrl("/hubs/notifications?sessionId=" + sessionId);
            connection.start().then(() => setConn("подключено"));
        });
    }

    updateAuthUI();

    document.getElementById("form").onsubmit = async (e) => {
        e.preventDefault();
        const body = new FormData();
        body.append("file", document.getElementById("file").files[0]);
        body.append("filter", filterSelect.value);
        body.append("blurRadius", document.getElementById("blur").value);
        body.append("sessionId", sessionId);

        try {
            const API = await apiUrl;
            const headers = {};
            const authSid = localStorage.getItem("authSessionId");
            if (authSid) {
                headers["Authorization"] = "Bearer " + authSid;
            }
            const response = await fetch(API + "/tasks", {method: "POST", headers, body});
            const data = await response.json();
            if (!response.ok) {
                alert(data.error || "Ошибка при отправке");
                return;
            }
            addTaskRow(data.id, filterSelect.value);
        } catch (err) {
            alert("Не удалось связаться с WebApi. Он запущен?");
        }
    };
</script>
</body>
</html>
