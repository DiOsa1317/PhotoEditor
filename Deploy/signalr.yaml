apiVersion: apps/v1
kind: Deployment
metadata:
  name: signalr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signalr
  template:
    metadata:
      labels:
        app: signalr
    spec:
      containers:
        - name: signalr
          image: pixelqueue-signalr:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: pixelqueue-config
            - secretRef:
                name: pixelqueue-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: signalr
spec:
  type: NodePort
  selector:
    app: signalr
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081